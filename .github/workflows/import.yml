name: import-inbox
# スマホから inbox/*.txt を追加 (GitHubアプリ/ブラウザ) すると自動で sets.csv に取り込む
on:
  push:
    paths: ["inbox/**.txt"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python hevy_import.py --inbox
      - run: |
          git config user.name "hevy-bot"
          git config user.email "hevy-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "import hevy sessions"
          git push
